name: Keep Supabase Alive

on:
  schedule:
    - cron: "0 6 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://scqwvjvhmqifbhchlnqv.supabase.co/rest/v1/users?select=id&limit=1" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}")
          echo "Supabase responded with HTTP $STATUS"
        env:
          SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNjcXd2anZobXFpZmJoY2hsbnF2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc2MTM1MjYsImV4cCI6MjA5MzE4OTUyNn0.nFKkCaufwDlDgI1AMPKB0axQTDbTTUTNUH0HRtyilWo
