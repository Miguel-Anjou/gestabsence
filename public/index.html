<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>GestAbsence — Gestion des congés</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=Syne:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; max-width: 100%; overflow-x: hidden; font-family: "DM Sans", system-ui, sans-serif; }
    /* Sécurité : les grands tableaux (calendrier) défilent horizontalement au lieu de casser la page */
    @media (max-width: 768px) {
      table { display: block; overflow-x: auto; -webkit-overflow-scrolling: touch; }
      input, select, textarea, button { font-size: 16px; } /* évite le zoom auto iOS */
    }
  </style>
</head>
<body><div id="root"></div></body>
</html>
